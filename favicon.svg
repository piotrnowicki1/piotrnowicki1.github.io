  <!-- beanie folded brim -->
  <rect x="13.5" y="29.5" width="37" height="8.5" rx="4.25" fill="#A8431F"/>
  <!-- cheeks -->
  <circle cx="22.5" cy="44.5" r="3.2" fill="#D89E76"/>
  <circle cx="41.5" cy="44.5" r="3.2" fill="#D89E76"/>
  <!-- eyes -->
  <circle cx="26.5" cy="41" r="2.3" fill="#262E1D"/>
  <circle cx="37.5" cy="41" r="2.3" fill="#262E1D"/>
  <!-- smile -->
