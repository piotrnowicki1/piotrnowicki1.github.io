<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="15" fill="#E9EEDC"/>
  <!-- face (large, fills the tile) -->
  <circle cx="32" cy="38" r="20" fill="#E5B48E"/>
  <!-- cheeks -->
  <circle cx="18.5" cy="44" r="3.8" fill="#D89E76"/>
  <circle cx="45.5" cy="44" r="3.8" fill="#D89E76"/>
  <!-- eyes -->
  <circle cx="25" cy="40" r="2.6" fill="#262E1D"/>
  <circle cx="39" cy="40" r="2.6" fill="#262E1D"/>
  <!-- smile -->
  <path d="M24 48 q8 4.5 16 0" fill="none" stroke="#B27A54" stroke-width="2.1" stroke-linecap="round"/>
  <!-- beanie pulled down over the forehead -->
  <path d="M11.5 30 Q11.5 7 32 7 Q52.5 7 52.5 30 Z" fill="#C1502E"/>
  <circle cx="32" cy="5.5" r="3.8" fill="#A8431F"/>
  <!-- folded brim, sits just above the eyes -->
  <rect x="9.5" y="26" width="45" height="9.5" rx="4.75" fill="#A8431F"/>
</svg>
